{% assign members = site.team_members | sort: 'order' %}
{% if include.featured_only %}
  {% assign members = members | where: 'featured_home', true %}
{% endif %}

<div class="team-grid">
  {% for member in members %}
    <div class="team-card">
      <img class="photo-hex {{ member.home_photo_class }}" src="{{ member.photo | relative_url }}" alt="{{ member.home_name }}">
      <div>
        <p class="team-name">{{ member.home_name }}</p>
        <p class="team-role">{{ member.home_role }}</p>
        <p class="team-note">{{ member.home_note }}</p>
        <a class="profile-link" href="{{ member.url | relative_url }}">Profile</a>
      </div>
    </div>
  {% endfor %}
</div>
