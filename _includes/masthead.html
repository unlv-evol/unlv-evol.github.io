<header class="masthead">
	<div class="masthead-inner">
		<a class="brand" href="{{ '/#top' | relative_url }}">
			<img class="brand-mark" src="{{ '/assets/logo.jpeg' | relative_url }}" alt="EVOL Lab logo">
			<span class="brand-name">EVOL Lab</span>
		</a>
		<button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
		<nav class="tabs" id="navTabs">
			<a class="tab{% if page.nav == 'about' %} active{% endif %}" href="{{ '/#about' | relative_url }}">About</a>
			<a class="tab{% if page.nav == 'news' %} active{% endif %}" href="{{ '/#news' | relative_url }}">News</a>
			<a class="tab{% if page.nav == 'people' %} active{% endif %}" href="{{ '/#people' | relative_url }}">People</a>
			<a class="tab{% if page.nav == 'publications' %} active{% endif %}" href="{{ '/publications.html' | relative_url }}">Publications</a>
			<a class="tab{% if page.nav == 'projects' %} active{% endif %}" href="{{ '/projects/index.html' | relative_url }}">Projects</a>
			<a class="tab{% if page.nav == 'join' %} active{% endif %}" href="{{ '/join.html' | relative_url }}">Join</a>
		</nav>
	</div>
</header>
